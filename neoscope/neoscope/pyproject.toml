[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neoscope"
version = "2.0.0"
description = "NeoScope — Order-book liquidity X-ray and execution-cost research lab using SSI FastConnect API v3 market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NeoScope Project" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14",
    "pydantic>=2.0",
    "httpx>=0.27",
    "websockets>=12",
    "streamlit>=1.67",
    "plotly>=5.20",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "ssi-sdk==3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "matplotlib>=3.8"]

[project.scripts]
neoscope = "neoscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
